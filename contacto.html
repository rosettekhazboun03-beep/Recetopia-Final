<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Recetopia</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/contacto.css">
</head>

<body>
	
    <header>
        <nav class="navbar navbar-expand-lg bg-transparent py-3">
            <div class="container">

                <a class="navbar-brand me-auto" href="index.html">
                    <img src="img/recetopia-logo.png" alt="Recetopia Logo" class="img-fluid logo-img">
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarRecetopia" aria-controls="navbarRecetopia"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarRecetopia">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center gap-3 navigation-links">
                        <li class="nav-item">
                            <a class="nav-link text-decoration-none" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-decoration-none" href="recetas.html">Recetas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-decoration-none" href="sobrenosotros.html">Sobre nosotros</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active text-decoration-none" href="contacto.html">Contacto</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link login-link text-decoration-none" href="login.html">Inicia Sesión</a>
                        </li>
                    </ul>

                    <div class="search-box ms-lg-3 mt-2 mt-lg-0">
                        <input type="text" placeholder="Buscar...">
                    </div>
                </div>

            </div>
        </nav>
    </header>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    
                    <div class="text-center mb-4">
                        <span class="highlight-text fw-bold">Escríbenos</span>
                        <h1 class="titulo-hero mt-1">¡Nos encantaría <span class="highlight-text">escucharte!</span></h1>
                        <p class="subtitulo-hero">¿Tienes alguna duda, sugerencia o quieres compartir una receta? Envíanos un mensaje.</p>
                    </div>

                    <form class="contact-form bg-white p-4 p-md-5 rounded-4 shadow-sm border">
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-bold">Nombre completo</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold">Correo electrónico</label>
                            <input type="email" class="form-control" id="email" placeholder="nombre@ejemplo.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="asunto" class="form-label fw-bold">Asunto</label>
                            <select class="form-select" id="asunto" required>
                                <option value="" selected disabled>Selecciona una opción</option>
                                <option value="1">Consulta general</option>
                                <option value="2">Sugerencia de receta</option>
                                <option value="3">Soporte técnico</option>
                                <option value="4">Alianzas / Colaboraciones</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="mensaje" class="form-label fw-bold">Mensaje</label>
                            <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="privacidad" required>
                            <label class="form-check-label text-muted" for="privacidad">
                                Acepto los términos y la política de privacidad.
                            </label>
                        </div>

                        <button type="submit" class="btn btn-recetopia w-100">Enviar mensaje</button>
                    </form>

                </div>
            </div>
        </div>
    </main>

    <footer class="py-4 mt-4">
        <div class="container text-center text-muted">
            <p class="mb-0">© Recetopia - Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
